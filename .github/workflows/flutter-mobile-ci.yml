name: Flutter Mobile CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-mobile-ci.yml"
  push:
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-mobile-ci.yml"

jobs:
  flutter-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Ensure Android scaffold exists
        run: flutter create --platforms=android --project-name monev_flutter .

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: monev-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
